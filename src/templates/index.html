<div class="bg-gray-800 rounded-lg shadow-lg p-6 mb-8">
    <h2 class="text-2xl font-bold text-white mb-4">Tabela Pivotada</h2>
    <div class="mb-4">
        <label for="filtro-braco" class="block text-sm font-medium text-gray-300 mb-2">Filtrar por Braço:</label>
        <select id="filtro-braco" class="bg-gray-700 text-white rounded px-3 py-2 w-full md:w-64">
            <option value="todos">Todos os Braços</option>
            <option value="1">Braço 1</option>
            <option value="2">Braço 2</option>
            <option value="3">Braço 3</option>
        </select>
    </div>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-700">
            <thead>
                <tr class="bg-gray-700">
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Braço</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Produto</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Cor</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Qtd. Moldes</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Rodada 1</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Rodada 2</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Rodada 3</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Rodada 4</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">Rodada 5</th>
                </tr>
            </thead>
            <tbody id="tabela-pivotada-body">
            </tbody>
        </table>
    </div>
</div>
